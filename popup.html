<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Vinted Relist</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <h1>Vinted Relist</h1>
      <span class="version" id="version"></span>
    </header>

    <section class="block">
      <label class="check">
        <input type="checkbox" id="deleteOld" />
        <span>Elimina il vecchio annuncio</span>
      </label>
      <label class="check">
        <input type="checkbox" id="autoReload" />
        <span>Ricarica la pagina dopo la pubblicazione</span>
      </label>
      <label class="check">
        <input type="checkbox" id="showOnOtherProfiles" />
        <span>Mostra i bottoni ovunque</span>
      </label>
    </section>

    <section class="block fields">
      <label class="field">
        <span class="field-label">Ordine</span>
        <select id="order">
          <option value="safe">Pubblica, poi elimina</option>
          <option value="clean">Elimina, poi pubblica</option>
        </select>
      </label>
      <label class="field narrow">
        <span class="field-label">Pausa</span>
        <input type="number" id="delayMs" min="300" step="100" />
      </label>
    </section>

    <section class="block status">
      <div class="status-row">
        <span class="dot" id="photoDot"></span>
        <span class="status-name">Formato foto</span>
        <span class="status-state" id="photoState">—</span>
      </div>
      <div class="status-row">
        <span class="dot" id="itemDot"></span>
        <span class="status-name">Formato annuncio</span>
        <span class="status-state" id="itemState">—</span>
      </div>
      <p class="hint" id="statusHint"></p>
    </section>

    <section class="block" id="draftsBlock" hidden>
      <div class="block-title">Bozze in sospeso</div>
      <div id="drafts" class="drafts"></div>
      <button id="copy" class="btn">Copia negli appunti</button>
    </section>

    <footer class="foot">
      <button id="tutorial" class="btn quiet">Rivedi il tutorial</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
